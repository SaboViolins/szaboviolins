<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mei Ilona</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap"
      rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --cream: #f5f0e8;
        --warm-white: #faf8f4;
        --dark: #1a1612;
        --brown: #6b4c2a;
        --gold: #c4973a;
        --text: #2e2620;
        --muted: #8a7b6e;
      }

      body {
        font-family: 'Jost', sans-serif;
        background: var(--warm-white);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3rem 1rem 2rem;
        text-align: center;
      }

      .ornament {
        display: block;
        width: 40px;
        height: 1px;
        background: var(--gold);
        margin: 1.5rem auto;
      }

      .greeting {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 300;
        color: var(--dark);
        line-height: 1.15;
        margin-bottom: 0.3rem;
      }

      .greeting em {
        font-style: italic;
        color: var(--brown);
      }

      .message {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-weight: 300;
        color: var(--muted);
        line-height: 1.8;
        max-width: 480px;
        margin: 0 auto;
      }

      .message-fr {
        margin-bottom: 1.5rem;
      }

      .message-en {
        font-size: clamp(0.9rem, 2vw, 1.05rem);
        color: var(--muted);
        opacity: 0.75;
      }

      .chat-wrapper {
        width: 100%;
        max-width: 460px;
        margin: 2rem auto 0;
        min-height: 380px;
      }

      .footer-note {
        margin-top: 1.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        color: var(--muted);
        opacity: 0.4;
      }
    </style>
  </head>
  <body>

    <h1 class="greeting">Mei <em>Ilona</em></h1>

    <span class="ornament"></span>

    <p class="message message-fr">
      Tu me manques chaque jour.<br>
      La porte est toujours ouverte.<br>
      Écris-moi quand tu veux — je suis là.
    </p>

    <p class="message message-en">
      I miss you every day.<br>
      The door is always open.<br>
      Write to me whenever you want — I am here.
    </p>

    <div class="chat-wrapper">
      <div id='tawk_6a668afd85c9821d4774c81b'></div>
    </div>

    <p class="footer-note">szaboviolins.com/mei</p>
